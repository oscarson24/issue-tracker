services:
  backend:
    container_name: mini-issue-tracker-backend-debug
    build:
      context: ./backend
      dockerfile: Dockerfile.debug
    volumes:
      - ./backend/IssueTracker.Api:/src/IssueTracker.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=IssueTracker;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
